[project]
name = "debate-project"
version = "1.00"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Itay", email = "itay.malich2@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "C4", "SIM"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py", "tests/*"]

[tool.coverage.report]
fail_under = 85

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
